<?xml version="1.0" encoding="utf-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Variant 1: Liquid Glass
    Same shapes + layout. Translucent frosted-glass materials,
    subtle gradients, soft glows, backdrop-blur feel.
  -->

  <defs>
    <!-- Frosted glass gradient for document -->
    <linearGradient id="glass-doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Glass top face shimmer -->
    <linearGradient id="glass-top" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E2E8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Play button radial glow -->
    <radialGradient id="glass-play" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#FF8A5C" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E84E1B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C0341A" stop-opacity="0.7"/>
    </radialGradient>

    <radialGradient id="glass-play-back" cx="0.6" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#B83214" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6B1A0A" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Outer ambient glow -->
    <filter id="ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Badge background gradient -->
    <linearGradient id="badge-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- ===== BADGE ===== -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="url(#badge-bg)"/>
  <!-- Subtle inner border for glass feel -->
  <rect x="17" y="17" width="478" height="478" rx="87" fill="none"
        stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>

  <!-- ===== AMBIENT GLOWS ===== -->
  <circle cx="240" cy="260" r="120" fill="#94A3B8" opacity="0.08" filter="url(#ambient)"/>
  <circle cx="358" cy="372" r="80" fill="#E84E1B" opacity="0.12" filter="url(#ambient)"/>

  <!-- ===== DOCUMENT (glass) ===== -->
  <!-- Right side -->
  <polygon points="300,140 340,110 340,370 300,380"
           fill="#475569" fill-opacity="0.5"/>

  <!-- Top face -->
  <polygon points="200,140 300,140 340,110 240,110"
           fill="url(#glass-top)"/>

  <!-- Top over fold -->
  <polygon points="130,260 200,140 240,110 170,230"
           fill="#E2E8F0" fill-opacity="0.65"/>

  <!-- Front face (frosted glass) -->
  <polygon points="130,260 200,140 300,140 300,380 130,380"
           fill="url(#glass-doc)"/>

  <!-- Glass highlight streak on front face -->
  <polygon points="160,170 180,140 195,140 175,170"
           fill="#FFFFFF" fill-opacity="0.35"/>
  <polygon points="145,210 165,175 175,175 155,210"
           fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Fold side -->
  <polygon points="130,260 170,230 240,110 200,140"
           fill="#64748B" fill-opacity="0.6"/>

  <!-- Fold flap -->
  <polygon points="130,260 200,260 200,140"
           fill="#94A3B8" fill-opacity="0.7"/>

  <!-- Fold crease -->
  <line x1="130" y1="260" x2="200" y2="140"
        stroke="#475569" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ===== PLAY BUTTON (glowing glass) ===== -->
  <!-- Back disc -->
  <circle cx="395" cy="345" r="100" fill="url(#glass-play-back)" filter="url(#glow)"/>

  <!-- Front disc -->
  <circle cx="358" cy="372" r="100" fill="url(#glass-play)"/>

  <!-- Glass highlight on play button -->
  <ellipse cx="338" cy="340" rx="55" ry="35"
           fill="#FFFFFF" fill-opacity="0.15"
           transform="rotate(-20 338 340)"/>

  <!-- Play triangle -->
  <polygon points="330,330 330,415 405,372"
           fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
